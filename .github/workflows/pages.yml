name: Deploy website

# Publishes the docs website, with Storybook at /storybook/, to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Build the website
        run: npm run build -w @unframed/website
        env:
          WEBSITE_BASE: /unframed-ui/

      - name: Build Storybook into the website
        run: |
          npm run build-storybook -w @unframed/storybook
          cp -r apps/storybook/dist apps/website/dist/storybook

      # GitHub Pages has no server-side routing: serving the app for unknown
      # paths lets React Router handle deep links like /components/dialog.
      - name: Add the SPA fallback
        run: cp apps/website/dist/index.html apps/website/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
