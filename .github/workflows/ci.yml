name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Core tests run in all three engines (packages/core/vitest.config.ts).
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      # The Claude Code plugin (plugins/unframed) is a committed copy of the
      # generated skill: the build regenerates it, so any change means it's stale.
      - name: Check the Claude Code plugin is up to date
        run: git diff --exit-code -- plugins/ || (echo "::error::plugins/unframed is out of date. Run 'npm run skill -w @unframed/cli' and commit the result." && exit 1)
      - run: npm run typecheck
      - run: npm test
