name: Release

# With pending changesets on main, opens (or updates) a "Version Packages" PR.
# Merging that PR publishes the new versions to npm with Trusted Publishing:
# npm verifies this repository and workflow through GitHub's OIDC token, so no
# npm token is stored anywhere. Provenance is attached automatically.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write # release tags
  pull-requests: write # the "Version Packages" PR
  id-token: write # Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11, which supports Trusted Publishing
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # v2: Changesets 3, which keeps the changesets a release candidate used in .changeset/pre.
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'

      # No pending changesets means the Version Packages PR was just merged:
      # publish whatever isn't on npm yet (already-published versions are skipped).
      # npm can take a minute to list a version it just took: a run right after the one
      # that published sees it as missing, and npm then refuses it (409). The second try
      # sees it and skips it; a real failure fails again.
      - name: Publish to npm
        if: steps.changesets.outputs.has-changesets == 'false'
        # Changesets tags each release with an annotated tag, which needs a git user;
        # the action no longer sets one, since v2 pushes through the GitHub API.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release || { sleep 90; npm run release; }
          git push origin --tags
