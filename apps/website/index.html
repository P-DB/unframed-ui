<!doctype html>
<html lang="en" data-uf-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Unframed: accessible web components that work in any framework, or none." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Unframed: UI components for any framework</title>

    <!-- Link previews (Slack, WhatsApp, LinkedIn, X...). They need absolute URLs.
         The image is rendered from scripts/og-image.html: npm run og-image -w @unframed/website -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unframed" />
    <meta property="og:title" content="Unframed: UI components for any framework" />
    <meta property="og:description" content="Accessible web components that work in any framework, or none." />
    <meta property="og:url" content="https://p-db.github.io/unframed-ui/" />
    <meta property="og:image" content="https://p-db.github.io/unframed-ui/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Unframed logo: UI components that don't care about your framework." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint (dark by default), so it never flashes.
      try {
        const saved = localStorage.getItem('uf-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.ufTheme = saved;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
