<!doctype html>
<!-- The link preview image (public/og-image.png). Regenerate with: npm run og-image -w @unframed/website -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 80px 88px;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* The docs header gradient, with the corner glow of the dark theme. */
        background:
          radial-gradient(900px 620px at 100% 0%, rgb(105 48 195 / 0.55), transparent 70%),
          radial-gradient(700px 500px at 0% 100%, rgb(105 48 195 / 0.22), transparent 70%),
          linear-gradient(120deg, #3b1a73 0%, #150c22 45%, #0a0b08 100%);
      }
      /* The word's capitals are as tall as the mark's box, and sit on its bottom edge. */
      .brand {
        display: flex;
        align-items: baseline;
        gap: 0.3em;
        font-size: 104px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .mark {
        position: relative;
        top: calc(0.94em / 32);
        width: 0.94em;
        height: 0.94em;
        color: #fff;
      }
      .title {
        margin: 0;
        max-width: 960px;
        font-size: 60px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .title em {
        font-style: normal;
        color: #c4a8f5;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 28px;
        color: rgb(255 255 255 / 0.75);
      }
      .frameworks {
        display: flex;
        gap: 14px;
      }
      .frameworks span {
        padding: 8px 18px;
        border: 2px solid rgb(255 255 255 / 0.25);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M3 7h5v11a8 8 0 0 0 16 0V7h5v24H3z" />
        <path d="M13 2h6v16a3 3 0 0 1-6 0z" />
      </svg>
      Unframed
    </div>
    <h1 class="title">UI components that <em>don’t care</em> about your framework.</h1>
    <div class="footer">
      <div class="frameworks"><span>HTML</span><span>React</span><span>Vue</span><span>Angular</span></div>
      <span>p-db.github.io/unframed-ui</span>
    </div>
  </body>
</html>
