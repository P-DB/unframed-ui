<!doctype html>
<!-- The link preview image (public/og-image.png). Regenerate with: npm run og-image -w @unframed/website -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 80px 88px;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* The docs header gradient, with the corner glow of the dark theme. */
        background:
          radial-gradient(900px 620px at 100% 0%, rgb(105 48 195 / 0.55), transparent 70%),
          radial-gradient(700px 500px at 0% 100%, rgb(105 48 195 / 0.22), transparent 70%),
          linear-gradient(120deg, #3b1a73 0%, #150c22 45%, #0a0b08 100%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        background: #fff;
        color: #6930c3;
      }
      .title {
        margin: 0;
        max-width: 960px;
        font-size: 60px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .title em {
        font-style: normal;
        color: #c4a8f5;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 28px;
        color: rgb(255 255 255 / 0.75);
      }
      .frameworks {
        display: flex;
        gap: 14px;
      }
      .frameworks span {
        padding: 8px 18px;
        border: 2px solid rgb(255 255 255 / 0.25);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 32 32" width="76" height="76" aria-hidden="true">
          <path d="M9 8v10a7 7 0 0 0 14 0V8" fill="none" stroke="currentColor" stroke-width="3.5" />
        </svg>
      </span>
      Unframed
    </div>
    <h1 class="title">UI components that <em>don’t care</em> about your framework.</h1>
    <div class="footer">
      <div class="frameworks"><span>HTML</span><span>React</span><span>Vue</span><span>Angular</span></div>
      <span>p-db.github.io/unframed-ui</span>
    </div>
  </body>
</html>
